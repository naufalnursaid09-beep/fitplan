name: Buat APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk FitPlan-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FitPlan-APK
          path: FitPlan-*.apk

      - name: Terbitkan APK di halaman Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FitPlan v1.0.${{ github.run_number }}
          body: "APK otomatis dari commit ${{ github.sha }}. Unduh file .apk di bawah lalu pasang di HP."
          files: FitPlan-*.apk
          make_latest: true
